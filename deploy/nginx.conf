# Shraddha Garden — Nginx site config.
# __WEBROOT__ is replaced with the absolute path to dist/ by setup.sh.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root __WEBROOT__;
    index index.html;

    # Allow reasonably large media/image uploads through to the API.
    client_max_body_size 10m;

    # --- security headers -----------------------------------------------------
    # NOTE: Strict-Transport-Security must live on the HTTPS (443) server block,
    # not here — browsers ignore HSTS on plain HTTP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API + health: reverse-proxy to the Node app on 127.0.0.1:4000 -------
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Requests are same-origin; strip Origin so the API's CORS check
        # treats them as server-to-server (allowed) regardless of hostname/IP.
        proxy_set_header Origin "";
    }

    location = /health {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
    }

    # --- static frontend with SPA fallback -----------------------------------
    # Long-cache the fingerprinted asset bundles.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
